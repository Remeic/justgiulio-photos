name: Keep Supabase active

on:
  schedule:
    # Three real database requests each day. Times are UTC.
    - cron: "17 1,9,17 * * *"
    # Keep this public scheduled workflow enabled during long photo-upload gaps.
    - cron: "43 3 1 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-supabase-active
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Supabase through the keep-alive route
        shell: bash
        env:
          KEEP_ALIVE_URL: https://justgiulio.dev/api/cron/keep-alive
        run: |
          set -euo pipefail

          response="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 5 \
              --connect-timeout 10 \
              --max-time 30 \
              "${KEEP_ALIVE_URL}"
          )"

          jq --exit-status '.success == true' <<<"${response}" >/dev/null

  heartbeat:
    if: github.event_name == 'schedule' && github.event.schedule == '43 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Record monthly repository activity
        shell: bash
        run: |
          set -euo pipefail

          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          date --utc --iso-8601=seconds >.github/keep-supabase-active.timestamp
          git add .github/keep-supabase-active.timestamp
          git commit --message "chore: keep scheduled workflows active [auto]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
