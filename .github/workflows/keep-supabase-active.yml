name: Keep Supabase active

on:
  schedule:
    # Three real database requests each day. Times are UTC.
    - cron: "17 1,9,17 * * *"
    # Keep this public scheduled workflow enabled during long photo-upload gaps.
    - cron: "43 3 1 * *"
  workflow_dispatch:
    inputs:
      run_heartbeat:
        description: Verify the monthly repository heartbeat
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: keep-supabase-active
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Supabase through the keep-alive route
        shell: bash
        env:
          KEEP_ALIVE_URL: https://justgiulio.dev/api/cron/keep-alive
        run: |
          set -euo pipefail

          response="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --retry 3 \
              --retry-all-errors \
              --retry-delay 5 \
              --connect-timeout 10 \
              --max-time 30 \
              "${KEEP_ALIVE_URL}"
          )"

          jq --exit-status '.success == true' <<<"${response}" >/dev/null

  heartbeat:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '43 3 1 * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_heartbeat)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - name: Record monthly repository activity
        uses: actions/github-script@v7
        with:
          script: |
            const path = ".github/keep-supabase-active.timestamp"
            let sha

            try {
              const response = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: context.ref,
              })
              sha = response.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: "chore: keep scheduled workflows active [auto]",
              content: Buffer.from(`${new Date().toISOString()}\n`).toString("base64"),
              branch: context.ref.replace("refs/heads/", ""),
              ...(sha ? { sha } : {}),
            })
