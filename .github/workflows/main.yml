name: Generate photo metadata

on:
  workflow_dispatch: {}
  push:
    paths:
      - "photos/**"

permissions:
  contents: write

concurrency:
  group: generate-photo-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to latest commit
        run: |
          git fetch origin ${{ github.ref }}
          git reset --hard origin/${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: "latest"

      # package.json minimo (se non esiste)
      - name: Ensure package.json
        run: |
          test -f package.json || \
          echo '{"dependencies":{"sharp":"^0.34.4","exifr":"^7.1.3"}}' > package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate metadata.json and thumbnails
        run: node scripts/generate-metadata.js

      - name: Commit changes
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add metadata.json
          git add thumbnails/ -f

          if git diff --cached --quiet; then
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            git commit -m "chore: update photo metadata and thumbnails [auto]"
            git push
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: photo-metadata-${{ github.run_number }}
          path: |
            metadata.json
            thumbnails/
          retention-days: 30
